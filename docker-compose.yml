name: sagent-bm25

services:
  postgres:
    build:
      context: ./backend
      dockerfile: Dockerfile.postgres
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    image: sagent-pg:pg17-bm25
    container_name: sagent-pg
    environment:
      POSTGRES_USER: sagent
      POSTGRES_PASSWORD: sagent
      POSTGRES_DB: sagent
    ports:
      - "5433:5432"
    volumes:
      - sagent_pg17_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagent -d sagent"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  sagent_pg17_data:
    external: true
    name: sagent_pg17_bm25_data
